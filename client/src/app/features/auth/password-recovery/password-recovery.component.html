<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="auth-logo">🛍️ Kantu Market</h1>
      <p class="auth-subtitle" *ngIf="mode === 'request'">Recupera tu contraseña</p>
      <p class="auth-subtitle" *ngIf="mode === 'reset'">Establece tu nueva contraseña</p>
    </div>

    <!-- Modo: Solicitar recuperación -->
    <form *ngIf="mode === 'request'" [formGroup]="requestForm" (ngSubmit)="onRequestSubmit()" class="auth-form">
      <div class="form-group">
        <label for="recovery-email">Correo electrónico</label>
        <input id="recovery-email" type="email" formControlName="email" placeholder="tu@correo.com"
          [class.input-error]="requestForm.get('email')?.invalid && requestForm.get('email')?.touched" />
        <span class="error-text" *ngIf="requestForm.get('email')?.hasError('required') && requestForm.get('email')?.touched">
          El correo es obligatorio.
        </span>
        <span class="error-text" *ngIf="requestForm.get('email')?.hasError('email') && requestForm.get('email')?.touched">
          Ingresa un correo válido.
        </span>
      </div>

      <div class="success-banner" *ngIf="message">{{ message }}</div>
      <div class="error-banner" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="requestForm.invalid || loading">
        <span *ngIf="!loading">Enviar enlace de recuperación</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>
    </form>

    <!-- Modo: Restablecer contraseña -->
    <form *ngIf="mode === 'reset'" [formGroup]="resetForm" (ngSubmit)="onResetSubmit()" class="auth-form">
      <div class="form-group">
        <label for="new_password">Nueva contraseña</label>
        <input id="new_password" type="password" formControlName="new_password" placeholder="Mínimo 8 caracteres"
          [class.input-error]="resetForm.get('new_password')?.invalid && resetForm.get('new_password')?.touched" />
        <span class="error-text" *ngIf="resetForm.get('new_password')?.hasError('minlength') && resetForm.get('new_password')?.touched">
          Mínimo 8 caracteres.
        </span>
      </div>

      <div class="form-group">
        <label for="new_password_confirm">Confirmar nueva contraseña</label>
        <input id="new_password_confirm" type="password" formControlName="new_password_confirm" placeholder="Repite tu contraseña" />
      </div>

      <div class="success-banner" *ngIf="message">{{ message }}</div>
      <div class="error-banner" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="resetForm.invalid || loading">
        <span *ngIf="!loading">Restablecer Contraseña</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>
    </form>

    <div class="auth-links">
      <a routerLink="/login">Volver al inicio de sesión</a>
    </div>
  </div>
</div>
